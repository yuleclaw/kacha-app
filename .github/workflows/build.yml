name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Ensure Android platform exists
        run: |
          ls -la
          echo "Checking @capacitor/android..."
          npm ls @capacitor/android || (echo "Installing @capacitor/android..." && npm install @capacitor/android)
          echo "Adding Android platform..."
          npx cap add android || echo "Android platform already exists or error occurred"
          ls -la android/ || echo "android dir not found"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kacha-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
